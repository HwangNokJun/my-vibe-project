<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAQ Analyzer — DirectCloud</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0f1117; --surface:#171b26; --surface2:#1e2333; --border:#2a3045; --border2:#3a4560;
    --accent:#3b7ef8; --accent2:#5b9bff; --text:#e2e8f4; --muted:#8896b3; --muted2:#5c6a85;
    --green:#22c55e; --amber:#f59e0b; --red:#ef4444; --cyan:#22d3ee;
    --mono:'IBM Plex Mono',monospace; --sans:'Noto Sans KR',sans-serif;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:var(--sans); font-size:13px; min-height:100vh; }
  .topnav { background:var(--surface); border-bottom:1px solid var(--border); height:48px; display:flex; align-items:center; padding:0 20px; gap:12px; position:sticky; top:0; z-index:100; }
  .logo { font-family:var(--mono); font-size:13px; color:var(--accent2); display:flex; align-items:center; gap:8px; }
  .logo-dot { width:6px; height:6px; border-radius:50%; background:var(--accent); }
  .nav-sep { width:1px; height:20px; background:var(--border); }
  .nav-title { color:var(--muted); font-size:12px; }
  .nav-right { margin-left:auto; display:flex; align-items:center; gap:10px; }
  .demo-badge { font-size:10px; font-family:var(--mono); color:var(--amber); border:1px solid rgba(245,158,11,.3); background:rgba(245,158,11,.08); padding:3px 8px; border-radius:3px; }
  .last-run { font-size:11px; color:var(--muted2); font-family:var(--mono); }
  .layout { display:flex; height:calc(100vh - 48px); }
  .sidebar { width:216px; background:var(--surface); border-right:1px solid var(--border); padding:14px 0; flex-shrink:0; overflow-y:auto; }
  .sb-label { font-size:10px; font-family:var(--mono); color:var(--muted2); letter-spacing:.08em; text-transform:uppercase; padding:10px 16px 4px; }
  .sb-item { display:flex; align-items:center; gap:9px; padding:7px 16px; cursor:pointer; color:var(--muted); border-left:2px solid transparent; transition:all .12s; font-size:12.5px; }
  .sb-item:hover { background:var(--surface2); color:var(--text); }
  .sb-item.active { background:rgba(59,126,248,.1); color:var(--accent2); border-left-color:var(--accent); }
  .sb-count { margin-left:auto; background:var(--surface2); border:1px solid var(--border); color:var(--muted); font-size:10px; font-family:var(--mono); padding:1px 6px; border-radius:10px; }
  .sb-item.active .sb-count { background:rgba(59,126,248,.15); border-color:rgba(59,126,248,.3); color:var(--accent2); }
  .main { flex:1; overflow-y:auto; padding:20px 24px; display:flex; flex-direction:column; gap:14px; }
  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  .stat { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:14px 16px; }
  .stat-label { font-size:10px; color:var(--muted); margin-bottom:6px; font-family:var(--mono); }
  .stat-val { font-size:28px; font-weight:700; line-height:1; }
  .stat-sub { font-size:10px; color:var(--muted2); margin-top:4px; font-family:var(--mono); }
  .c-blue{color:var(--accent2);} .c-green{color:var(--green);} .c-amber{color:var(--amber);} .c-cyan{color:var(--cyan);}
  .toolbar { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:10px 14px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .tb-label { font-size:11px; color:var(--muted); font-family:var(--mono); margin-right:4px; }
  .chip { display:inline-flex; align-items:center; padding:4px 10px; border-radius:4px; border:1px solid var(--border); font-size:11px; cursor:pointer; color:var(--muted); background:var(--surface2); transition:all .12s; }
  .chip:hover { border-color:var(--accent); color:var(--accent2); }
  .chip.on { border-color:var(--accent); color:var(--accent2); background:rgba(59,126,248,.1); }
  .tb-right { margin-left:auto; }
  .sort-sel { background:var(--surface2); border:1px solid var(--border); color:var(--muted); font-size:11px; padding:4px 8px; border-radius:4px; font-family:var(--sans); cursor:pointer; }
  .faq-list { display:flex; flex-direction:column; gap:8px; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:8px; overflow:hidden; transition:border-color .15s; }
  .card:hover { border-color:var(--border2); }
  .card.open { border-color:var(--accent); }
  .card-header { display:flex; align-items:center; gap:12px; padding:12px 16px; cursor:pointer; user-select:none; }
  .score { width:36px; height:36px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; flex-shrink:0; font-family:var(--mono); }
  .s5{background:rgba(34,197,94,.15);color:var(--green);border:1px solid rgba(34,197,94,.3);}
  .s4{background:rgba(34,211,238,.12);color:var(--cyan);border:1px solid rgba(34,211,238,.3);}
  .s3{background:rgba(245,158,11,.12);color:var(--amber);border:1px solid rgba(245,158,11,.3);}
  .s2{background:rgba(239,68,68,.10);color:var(--red);border:1px solid rgba(239,68,68,.2);}
  .s1{background:rgba(92,106,133,.15);color:var(--muted);border:1px solid rgba(92,106,133,.3);}
  .card-info { flex:1; min-width:0; }
  .card-title { font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:4px; }
  .card-meta { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .cat { font-size:10px; font-family:var(--mono); padding:2px 7px; border-radius:3px; border:1px solid; }
  .cat-file{color:#60a5fa;border-color:rgba(96,165,250,.3);background:rgba(96,165,250,.08);}
  .cat-mob{color:#a78bfa;border-color:rgba(167,139,250,.3);background:rgba(167,139,250,.08);}
  .cat-perm{color:#34d399;border-color:rgba(52,211,153,.3);background:rgba(52,211,153,.08);}
  .cat-auth{color:#fb923c;border-color:rgba(251,146,60,.3);background:rgba(251,146,60,.08);}
  .cat-net{color:#f87171;border-color:rgba(248,113,113,.3);background:rgba(248,113,113,.08);}
  .cat-sync{color:#fbbf24;border-color:rgba(251,191,36,.3);background:rgba(251,191,36,.08);}
  .cat-etc{color:#94a3b8;border-color:rgba(148,163,184,.3);background:rgba(148,163,184,.08);}
  .grp { font-size:10px; color:var(--muted2); font-family:var(--mono); }
  .grp b { color:var(--muted); }
  .card-right { display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .bl-link { font-size:10px; font-family:var(--mono); color:var(--muted2); text-decoration:none; padding:3px 8px; border:1px solid var(--border); border-radius:3px; transition:all .12s; white-space:nowrap; }
  .bl-link:hover { color:var(--accent2); border-color:var(--accent); }
  .chevron { color:var(--muted2); font-size:11px; transition:transform .2s; }
  .card.open .chevron { transform:rotate(180deg); }
  .card-body { display:none; border-top:1px solid var(--border); }
  .card.open .card-body { display:block; }
  .card-body-inner { padding:16px; display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .panel { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:12px 14px; }
  .panel-title { font-size:10px; font-family:var(--mono); color:var(--muted2); letter-spacing:.06em; text-transform:uppercase; margin-bottom:10px; display:flex; align-items:center; gap:6px; }
  .panel-title::before { content:''; width:3px; height:10px; border-radius:2px; background:var(--accent); display:inline-block; }
  .info-row { font-size:12px; color:var(--muted); line-height:2; }
  .info-row span { color:var(--text); }
  .draft-note { margin-top:8px; padding:8px 10px; background:var(--bg); border-radius:4px; font-family:var(--mono); font-size:11px; color:var(--muted2); line-height:1.6; }
  .sim-row { display:flex; align-items:center; gap:8px; padding:5px 0; border-bottom:1px solid var(--border); font-size:11.5px; color:var(--muted); }
  .sim-row:last-child { border-bottom:none; }
  .sim-id { font-family:var(--mono); font-size:10px; color:var(--muted2); flex-shrink:0; }
  .sim-title { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .empty-msg { text-align:center; padding:40px; color:var(--muted2); font-family:var(--mono); font-size:12px; }
  ::-webkit-scrollbar { width:5px; }
  ::-webkit-scrollbar-thumb { background:var(--border2); border-radius:3px; }
</style>
</head>
<body>

<nav class="topnav">
  <div class="logo"><div class="logo-dot"></div>DirectCloud</div>
  <div class="nav-sep"></div>
  <span class="nav-title">FAQ Analyzer</span>
  <div class="nav-right">
    <span class="demo-badge">DEMO</span>
    <span class="last-run">샘플 데이터 | 최근 12개월 기준</span>
  </div>
</nav>

<div class="layout">
  <aside class="sidebar">
    <div class="sb-label">카테고리</div>
    <div class="sb-item active" onclick="filterCat('all',this)"><span>전체</span><span class="sb-count" id="cnt-all">-</span></div>
    <div class="sb-item" onclick="filterCat('파일공유',this)"><span>📁 파일공유</span><span class="sb-count" id="cnt-file">0</span></div>
    <div class="sb-item" onclick="filterCat('모바일앱',this)"><span>📱 모바일앱</span><span class="sb-count" id="cnt-mob">0</span></div>
    <div class="sb-item" onclick="filterCat('권한관리',this)"><span>🔐 권한관리</span><span class="sb-count" id="cnt-perm">0</span></div>
    <div class="sb-item" onclick="filterCat('인증',this)"><span>🔑 인증/로그인</span><span class="sb-count" id="cnt-auth">0</span></div>
    <div class="sb-item" onclick="filterCat('네트워크',this)"><span>🌐 네트워크</span><span class="sb-count" id="cnt-net">0</span></div>
    <div class="sb-item" onclick="filterCat('동기화',this)"><span>🔄 동기화</span><span class="sb-count" id="cnt-sync">0</span></div>
    <div class="sb-item" onclick="filterCat('기타',this)"><span>📌 기타</span><span class="sb-count" id="cnt-etc">0</span></div>
    <div class="sb-label" style="margin-top:10px;">FAQ 적합도</div>
    <div class="sb-item" onclick="filterScore(5,this)"><span>★★★★★ 5점</span><span class="sb-count" id="cnt-s5">0</span></div>
    <div class="sb-item" onclick="filterScore(4,this)"><span>★★★★ 4점</span><span class="sb-count" id="cnt-s4">0</span></div>
    <div class="sb-item" onclick="filterScore(3,this)"><span>★★★ 3점</span><span class="sb-count" id="cnt-s3">0</span></div>
  </aside>

  <main class="main">
    <div class="stats">
      <div class="stat"><div class="stat-label">분석된 문의</div><div class="stat-val c-blue" id="st-total">-</div><div class="stat-sub">최근 12개월</div></div>
      <div class="stat"><div class="stat-label">FAQ 후보 (3점↑)</div><div class="stat-val c-green" id="st-faq">-</div><div class="stat-sub" id="st-pct">-</div></div>
      <div class="stat"><div class="stat-label">유사 문의 그룹</div><div class="stat-val c-amber" id="st-groups">-</div><div class="stat-sub">반복 문의 묶음</div></div>
      <div class="stat"><div class="stat-label">최다 반복</div><div class="stat-val c-cyan" id="st-top">-</div><div class="stat-sub">건 (동일 주제)</div></div>
    </div>
    <div class="toolbar">
      <span class="tb-label">필터</span>
      <div class="chip on" id="chip-all"   onclick="chipFilter('all')">전체</div>
      <div class="chip"    id="chip-high"  onclick="chipFilter('high')">4점↑</div>
      <div class="chip"    id="chip-group" onclick="chipFilter('group')">그룹 있음</div>
      <div class="tb-right">
        <select class="sort-sel" id="sortSel" onchange="renderCards()">
          <option value="score">적합도 높은 순</option>
          <option value="count">유사 건수 많은 순</option>
          <option value="recent">최신 순</option>
        </select>
      </div>
    </div>
    <div class="faq-list" id="faqList"></div>
  </main>
</div>

<script>
// ── 샘플 데이터 ───────────────────────────────────────────────
const SAMPLE = [
  {
    id:1042, key:'DCINQ-1042', score:5, groupSize:8,
    title:'공유 링크를 클릭하면 "접근 권한이 없습니다" 오류가 납니다',
    cat:{ key:'파일공유', cls:'cat-file', id:'file' },
    similar:[
      { id:1067, key:'DCINQ-1067', summary:'링크 열면 접근 불가 메시지 표시' },
      { id:1089, key:'DCINQ-1089', summary:'외부 사용자 공유 링크 오류' },
      { id:1102, key:'DCINQ-1102', summary:'공유 URL 접속 안 됨' },
      { id:1115, key:'DCINQ-1115', summary:'파일 공유 후 상대방이 열지 못함' },
      { id:1123, key:'DCINQ-1123', summary:'링크 만료 전인데 접근 불가' },
    ]
  },
  {
    id:1089, key:'DCINQ-1089', score:5, groupSize:5,
    title:'모바일 앱에서 파일 업로드가 되지 않습니다',
    cat:{ key:'모바일앱', cls:'cat-mob', id:'mob' },
    similar:[
      { id:1095, key:'DCINQ-1095', summary:'iOS에서 파일 첨부 안 됨' },
      { id:1110, key:'DCINQ-1110', summary:'안드로이드 업로드 오류' },
      { id:1138, key:'DCINQ-1138', summary:'모바일에서 사진 올리기 실패' },
    ]
  },
  {
    id:1103, key:'DCINQ-1103', score:4, groupSize:4,
    title:'폴더 편집 권한을 특정 사용자에게만 부여할 수 있나요?',
    cat:{ key:'권한관리', cls:'cat-perm', id:'perm' },
    similar:[
      { id:1118, key:'DCINQ-1118', summary:'사용자별 접근 권한 제한 방법' },
      { id:1125, key:'DCINQ-1125', summary:'편집 권한 부여 방법 문의' },
    ]
  },
  {
    id:1131, key:'DCINQ-1131', score:4, groupSize:3,
    title:'SSO 로그인 후 자동으로 로그아웃됩니다',
    cat:{ key:'인증', cls:'cat-auth', id:'auth' },
    similar:[
      { id:1144, key:'DCINQ-1144', summary:'로그인 유지가 안 됩니다' },
      { id:1158, key:'DCINQ-1158', summary:'세션 만료가 너무 빈번합니다' },
    ]
  },
  {
    id:1201, key:'DCINQ-1201', score:4, groupSize:4,
    title:'동기화가 완료됐는데 PC에서 파일이 보이지 않습니다',
    cat:{ key:'동기화', cls:'cat-sync', id:'sync' },
    similar:[
      { id:1215, key:'DCINQ-1215', summary:'동기화 후 파일 누락' },
      { id:1228, key:'DCINQ-1228', summary:'클라우드에는 있는데 로컬에 없음' },
    ]
  },
  {
    id:1155, key:'DCINQ-1155', score:3, groupSize:2,
    title:'대용량 파일 업로드 시 중간에 멈춥니다',
    cat:{ key:'파일공유', cls:'cat-file', id:'file' },
    similar:[
      { id:1170, key:'DCINQ-1170', summary:'1GB 이상 파일 업로드 실패' },
    ]
  },
  {
    id:1162, key:'DCINQ-1162', score:2, groupSize:1,
    title:'특정 IP에서만 접속이 불가능합니다',
    cat:{ key:'네트워크', cls:'cat-net', id:'net' },
    similar:[]
  },
  {
    id:1180, key:'DCINQ-1180', score:3, groupSize:2,
    title:'비밀번호 재설정 메일이 오지 않습니다',
    cat:{ key:'인증', cls:'cat-auth', id:'auth' },
    similar:[
      { id:1192, key:'DCINQ-1192', summary:'초기화 이메일 미수신' },
    ]
  },
  {
    id:1240, key:'DCINQ-1240', score:3, groupSize:2,
    title:'파일 미리보기가 지원되는 형식이 어떻게 되나요?',
    cat:{ key:'파일공유', cls:'cat-file', id:'file' },
    similar:[
      { id:1251, key:'DCINQ-1251', summary:'PDF 미리보기 안 됨' },
    ]
  },
  {
    id:1260, key:'DCINQ-1260', score:4, groupSize:3,
    title:'관리자 계정을 추가로 만들 수 있나요?',
    cat:{ key:'권한관리', cls:'cat-perm', id:'perm' },
    similar:[
      { id:1271, key:'DCINQ-1271', summary:'서브 관리자 권한 설정' },
      { id:1285, key:'DCINQ-1285', summary:'관리자 계정 수 제한 문의' },
    ]
  },
];

const CATS_LIST = ['파일공유','모바일앱','권한관리','인증','네트워크','동기화','기타'];
const CATS_ID   = ['file','mob','perm','auth','net','sync','etc'];

let allCards = [...SAMPLE];
let activeFilter = 'all', activeCat = 'all', activeScore = null;

// ── 초기화 ────────────────────────────────────────────────────
function init() {
  updateSidebar();
  updateStats();
  renderCards();
}

// ── 렌더링 ────────────────────────────────────────────────────
function renderCards() {
  const sort = document.getElementById('sortSel').value;
  let list = [...allCards];
  if (activeCat !== 'all')  list = list.filter(c => c.cat.key === activeCat);
  if (activeScore !== null) list = list.filter(c => c.score === activeScore);
  if (activeFilter === 'high')  list = list.filter(c => c.score >= 4);
  if (activeFilter === 'group') list = list.filter(c => c.groupSize >= 2);
  if (sort === 'score')  list.sort((a,b) => b.score - a.score || b.groupSize - a.groupSize);
  if (sort === 'count')  list.sort((a,b) => b.groupSize - a.groupSize);

  const el = document.getElementById('faqList');
  el.innerHTML = list.length === 0
    ? '<div class="empty-msg">해당 조건의 문의가 없습니다.</div>'
    : list.map((c,i) => cardHTML(c,i)).join('');
}

function cardHTML(c, i) {
  const simRows = c.similar.slice(0,5).map(s =>
    `<div class="sim-row">
       <span class="sim-id">${s.key}</span>
       <span class="sim-title">${esc(s.summary)}</span>
     </div>`).join('');
  const more = c.similar.length > 5
    ? `<div class="sim-row"><span class="sim-id" style="color:var(--muted2)">+${c.similar.length-5}건</span><span class="sim-title" style="color:var(--muted2)">더 보기</span></div>` : '';
  const noSim = c.similar.length === 0
    ? `<div class="sim-row"><span style="color:var(--muted2);font-size:11px;">단독 문의 (유사 문의 없음)</span></div>` : '';

  return `
  <div class="card" id="cd${i}">
    <div class="card-header" onclick="toggle('cd${i}')">
      <div class="score s${c.score}">${c.score}</div>
      <div class="card-info">
        <div class="card-title">${esc(c.title)}</div>
        <div class="card-meta">
          <span class="cat ${c.cat.cls}">${c.cat.key}</span>
          <span class="grp">유사 문의 <b>${c.groupSize}건</b> 묶음</span>
        </div>
      </div>
      <div class="card-right">
        <span class="bl-link">${c.key}</span>
        <span class="chevron">▼</span>
      </div>
    </div>
    <div class="card-body"><div class="card-body-inner">
      <div class="panel">
        <div class="panel-title">FAQ 적합도 분석</div>
        <div class="info-row">카테고리: <span>${c.cat.key}</span></div>
        <div class="info-row">유사 문의: <span>${c.groupSize}건</span></div>
        <div class="info-row">적합도 점수: <span>${c.score}점 / 5점</span></div>
        <div class="draft-note">✏️ FAQ 초안은 이 문의를 참고하여 수동으로 작성해주세요.</div>
      </div>
      <div class="panel">
        <div class="panel-title">유사 문의 ${c.groupSize}건</div>
        <div class="sim-row">
          <span class="sim-id">${c.key}</span>
          <span class="sim-title">${esc(c.title)}</span>
        </div>
        ${simRows}${more}${noSim}
      </div>
    </div></div>
  </div>`;
}

// ── 사이드바 / 통계 ───────────────────────────────────────────
function updateSidebar() {
  document.getElementById('cnt-all').textContent = allCards.length;
  CATS_LIST.forEach((cat, i) => {
    document.getElementById(`cnt-${CATS_ID[i]}`).textContent =
      allCards.filter(c => c.cat.key === cat).length;
  });
  [5,4,3].forEach(s =>
    document.getElementById(`cnt-s${s}`).textContent =
      allCards.filter(c => c.score === s).length);
}

function updateStats() {
  const total = allCards.length;
  const faq   = allCards.filter(c => c.score >= 3).length;
  const grps  = allCards.filter(c => c.groupSize >= 2).length;
  const top   = Math.max(...allCards.map(c => c.groupSize));
  document.getElementById('st-total').textContent  = total;
  document.getElementById('st-faq').textContent    = faq;
  document.getElementById('st-pct').textContent    = `전체의 ${Math.round(faq/total*100)}%`;
  document.getElementById('st-groups').textContent = grps;
  document.getElementById('st-top').textContent    = top;
}

// ── 필터 / 유틸 ───────────────────────────────────────────────
function filterCat(cat, el) {
  document.querySelectorAll('.sb-item').forEach(i => i.classList.remove('active'));
  el.classList.add('active');
  activeCat = cat; activeScore = null; renderCards();
}
function filterScore(s, el) {
  document.querySelectorAll('.sb-item').forEach(i => i.classList.remove('active'));
  el.classList.add('active');
  activeScore = s; activeCat = 'all'; renderCards();
}
function chipFilter(type) {
  activeFilter = type;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
  document.getElementById(`chip-${type}`).classList.add('on');
  renderCards();
}
function toggle(id) { document.getElementById(id).classList.toggle('open'); }
function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

init();
</script>
</body>
</html>
